[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoagent-platform-api"
version = "0.1.0"
description = "Phase 0 FastAPI foundation for the OncoAgent Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.28,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/models/retrieval.py" = ["E501"]
"app/retrieval/*.py" = ["E501"]
"app/schemas/retrieval.py" = ["E501"]
"scripts/*.py" = ["E501"]
"app/core/config.py" = ["E501"]
"tests/retrieval/*.py" = ["E501"]
"tests/workflow/*.py" = ["E501"]
"tests/mcp/*.py" = ["E501"]
"tests/crewai/*.py" = ["E501"]
"app/workflow/*.py" = ["E501"]
"app/models/workflow.py" = ["E501"]
"app/models/crewai.py" = ["E501"]
"app/api/routes.py" = ["E501", "E701"]
"app/services/crewai.py" = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "alembic/versions"

[[tool.mypy.overrides]]
module = ["crewai_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
