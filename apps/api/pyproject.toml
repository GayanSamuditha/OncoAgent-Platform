[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoagent-platform-api"
version = "0.1.0"
description = "Phase 0 FastAPI foundation for the OncoAgent Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.1.1,<4",
  "mcp>=1.28,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "torch==2.13.0",
  "transformers>=5.10,<6",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.42,<2",
  "opentelemetry-instrumentation-fastapi==0.63b1",
  "prometheus-client>=0.21,<1",
  "PyJWT==2.13.0",
  "temporalio==1.30.0",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "bandit==1.8.6",
  "mypy>=1.13,<2",
  "pip-audit==2.9.0",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/models/retrieval.py" = ["E501"]
"app/retrieval/*.py" = ["E501"]
"app/schemas/retrieval.py" = ["E501"]
"scripts/*.py" = ["E501"]
"app/core/config.py" = ["E501"]
"tests/retrieval/*.py" = ["E501"]
"tests/workflow/*.py" = ["E501"]
"tests/mcp/*.py" = ["E501"]
"tests/crewai/*.py" = ["E501"]
"app/workflow/*.py" = ["E501"]
"app/models/workflow.py" = ["E501"]
"app/models/crewai.py" = ["E501"]
"app/api/routes.py" = ["E501", "E701"]
"app/services/crewai.py" = ["E501", "E701", "E702"]
"app/observability/*.py" = ["E501"]
"app/temporal/*.py" = ["E501"]
"app/resilience/*.py" = ["E501"]
"app/identity/*.py" = ["E501"]
"app/models/identity.py" = ["E501"]
"tests/identity/*.py" = ["E501"]
"../../scripts/*.py" = ["E501"]
"app/main.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "alembic/versions"

[[tool.mypy.overrides]]
module = ["crewai_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
