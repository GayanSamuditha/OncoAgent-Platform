[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoagent-crewai-client"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["crewai==1.15.7", "mcp>=1.28,<2", "pydantic>=2.11,<3", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = [".."]
include = ["crewai_client*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
