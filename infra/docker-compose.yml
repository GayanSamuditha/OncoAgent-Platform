name: oncoagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncoagent}
      POSTGRES_USER: ${POSTGRES_USER:-oncoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncoagent_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - oncoagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M

  api-migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: api-runtime
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oncoagent}:${POSTGRES_PASSWORD:-oncoagent_dev}@postgres:5432/${POSTGRES_DB:-oncoagent}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    working_dir: /opt/oncoagent/apps/api
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: api-runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oncoagent}:${POSTGRES_PASSWORD:-oncoagent_dev}@postgres:5432/${POSTGRES_DB:-oncoagent}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      CREWAI_OLLAMA_BASE_URL: ${CREWAI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CREWAI_MCP_URL: http://mcp:8010/mcp
      CREWAI_MCP_CLIENT_ID: ${CREWAI_MCP_CLIENT_ID:-}
      CREWAI_MCP_TOKEN: ${CREWAI_MCP_TOKEN:-}
      CREWAI_MCP_DATASET_IDS: ${CREWAI_MCP_DATASET_IDS:-}
      IDENTITY_LEGACY_HEADERS_ENABLED: "false"
      TEMPORAL_DEV_FAULT_STAGE: ""
      TEMPORAL_DEV_FAULT_CATEGORY: ""
      CREWAI_EXECUTION_MODE: temporal
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  mcp:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: mcp-runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oncoagent}:${POSTGRES_PASSWORD:-oncoagent_dev}@postgres:5432/${POSTGRES_DB:-oncoagent}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
      MCP_ENABLED: "true"
      MCP_DEV_CLIENTS: ${MCP_DEV_CLIENTS:-[]}
      IDENTITY_LEGACY_HEADERS_ENABLED: "false"
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8010}:8010"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8010),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-postgresql:
    profiles: [temporal, full]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev}
    volumes:
      - oncoagent-temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-schema-init:
    profiles: [temporal, full]
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    environment:
      TEMPORAL_POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev}
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sql_tool() { database="$${1}"; shift; temporal-sql-tool --plugin postgres12 --ep temporal-postgresql --port 5432 --user temporal --pw "$${TEMPORAL_POSTGRES_PASSWORD}" --db "$${database}" "$${@}"; }
        sql_tool temporal create || true
        sql_tool temporal_visibility create || true
        sql_tool temporal setup-schema -v 0.0
        sql_tool temporal_visibility setup-schema -v 0.0
        sql_tool temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        sql_tool temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

  temporal:
    profiles: [temporal, full]
    image: temporalio/server:1.31.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal_dev}
      POSTGRES_SEEDS: temporal-postgresql
      SKIP_SCHEMA_SETUP: "true"
      SERVICES: frontend,history,matching,worker
      NUM_HISTORY_SHARDS: 16
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    depends_on:
      temporal-schema-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"
    healthcheck:
      # The server advertises its frontend through the Compose service name;
      # probing that address also works with the pinned image's network setup.
      test: ["CMD", "nc", "-z", "temporal", "7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    deploy:
      resources:
        limits:
          memory: 768M

  temporal-namespace-init:
    profiles: [temporal, full]
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: ["temporal operator namespace describe --address temporal:7233 --namespace oncoagent >/dev/null 2>&1 || temporal operator namespace create --address temporal:7233 --namespace oncoagent --retention 1d"]

  temporal-ui:
    profiles: [temporal, full]
    image: temporalio/ui:2.52.1
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: oncoagent
      TEMPORAL_DISABLE_WRITE_ACTIONS: "true"
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  temporal-worker:
    profiles: [temporal, full]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: worker-runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-oncoagent}:${POSTGRES_PASSWORD:-oncoagent_dev}@postgres:5432/${POSTGRES_DB:-oncoagent}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      TEMPORAL_ADDRESS: temporal:7233
      CREWAI_EXECUTION_MODE: temporal
      CREWAI_MCP_URL: http://mcp:8010/mcp
      CREWAI_MCP_CLIENT_ID: ${CREWAI_MCP_CLIENT_ID:-crewai-oncology-research}
      CREWAI_MCP_TOKEN: ${CREWAI_MCP_TOKEN:-}
      CREWAI_MCP_DATASET_IDS: ${CREWAI_MCP_DATASET_IDS:-}
      CREWAI_OLLAMA_BASE_URL: ${CREWAI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MCP_ENABLED: "true"
    depends_on:
      temporal-namespace-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; raise SystemExit(0 if os.getenv('TEMPORAL_ADDRESS') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  otel-collector:
    profiles: [observability, full]
    build:
      context: .
      dockerfile: observability/Dockerfile
    image: oncoagent/otel-collector:0.132.0-healthcheck
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_PROMETHEUS_HOST_PORT:-8889}:8889"
      - "127.0.0.1:${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    profiles: [observability, full]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - oncoagent-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  tempo:
    profiles: [observability, full]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - oncoagent-tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    profiles: [observability, full]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - oncoagent-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512M

  evaluation-worker:
    profiles: [evaluation, full]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: evaluation-runtime
    command: ["sleep", "infinity"]
    restart: "no"

volumes:
  oncoagent-postgres-data:
  oncoagent-prometheus-data:
  oncoagent-tempo-data:
  oncoagent-grafana-data:
  oncoagent-temporal-postgres-data:
