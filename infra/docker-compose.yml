services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncoagent}
      POSTGRES_USER: ${POSTGRES_USER:-oncoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncoagent_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - oncoagent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncoagent} -d ${POSTGRES_DB:-oncoagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oncoagent-postgres-data:
