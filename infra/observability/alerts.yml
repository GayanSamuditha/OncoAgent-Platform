groups:
  - name: oncoagent-security
    rules:
      - alert: OncoAgentAuthorizationBypass
        expr: increase(oncoagent_security_authorization_denials_total{reason="bypass"}[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Authorization bypass signal detected"}
      - alert: OncoAgentAuditIntegrityFailure
        expr: oncoagent_security_audit_integrity_failures > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Audit integrity verification failed"}
      - alert: OncoAgentPrivacyViolation
        expr: increase(oncoagent_security_privacy_violations_total[5m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Privacy boundary violation detected"}
      - alert: OncoAgentSecretFinding
        expr: oncoagent_security_secret_scan_findings > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Sanitized secret scan finding detected"}
  - name: oncoagent-development
    rules:
      - alert: OncoAgentApiErrors
        expr: rate(oncoagent_http_errors_total[5m]) > 0.1
        for: 5m
      - alert: OncoAgentWorkflowFailures
        expr: rate(oncoagent_workflow_failures_total[5m]) > 0
        for: 5m
      - alert: OncoAgentOrphanMcpRequests
        expr: oncoagent_orphan_mcp_requests > 0
        for: 1m
      - alert: OncoAgentGovernanceGateFailure
        expr: oncoagent_governance_gate_status == 0
        for: 1m
      - alert: OncoAgentPerformanceOverload
        expr: rate(oncoagent_performance_overload_rejections_total[5m]) > 0.1
        for: 5m
      - alert: OncoAgentDatabasePoolPressure
        expr: oncoagent_performance_queue_depth{queue="database"} > 0
        for: 5m
      - alert: OncoAgentTemporalQueueBacklog
        expr: oncoagent_performance_queue_depth{queue="temporal"} > 0
        for: 5m
      - alert: OncoAgentRetrySpike
        expr: rate(oncoagent_temporal_activity_retries_total[5m]) > 0.1
        for: 5m
      - alert: OncoAgentMcpErrorSpike
        expr: rate(oncoagent_mcp_errors_total[5m]) > 0.1
        for: 5m
      - alert: OncoAgentCancellationFailure
        expr: rate(oncoagent_performance_cancellation_latency_seconds_count[5m]) > 0 and oncoagent_performance_slo_status{slo="cancellation_correctness",status="fail"} == 1
        for: 1m
