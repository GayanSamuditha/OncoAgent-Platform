global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: oncoagent-api
    static_configs:
      - targets: [api:8000]
  - job_name: oncoagent-mcp
    static_configs:
      - targets: [mcp:9102]
  - job_name: oncoagent-temporal-worker
    static_configs:
      - targets: [temporal-worker:9101]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

rule_files:
  - /etc/prometheus/alerts.yml
