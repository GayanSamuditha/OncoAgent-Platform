apiVersion: 1

groups:
  - orgId: 1
    name: oncoagent-development
    folder: OncoAgent
    interval: 1m
    rules:
      - uid: oncoagent-orphan-mcp
        title: OncoAgent orphan MCP requests
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: oncoagent_orphan_mcp_requests > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Orphan MCP request correlation detected
        labels:
          severity: development
        isPaused: false

      - uid: oncoagent-governance-gate
        title: OncoAgent governance gate failure
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: oncoagent_governance_gate_status == 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: A development governance gate is failing
        labels:
          severity: development
        isPaused: false
