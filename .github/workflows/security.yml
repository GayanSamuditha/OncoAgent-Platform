name: Security readiness

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://oncoagent:oncoagent_dev@localhost:5432/oncoagent
      ENVIRONMENT: test
      CREWAI_ENABLED: "false"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: oncoagent
          POSTGRES_USER: oncoagent
          POSTGRES_PASSWORD: oncoagent_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncoagent -d oncoagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'apps/api[dev]'
          python -m pip install -e apps/crewai_client
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Initialize test database
        working-directory: apps/api
        run: python -m alembic -c alembic.ini upgrade head
      - name: Tests and static checks
        run: |
          cd apps/api
          python -m pytest
          python -m ruff check app tests
          python -m mypy app
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
      - name: Sanitized source security scan
        run: |
          docker pull aquasec/trivy:0.61.0
          TRIVY_COMMAND="docker run --rm -v $GITHUB_WORKSPACE:/work:ro -w /work aquasec/trivy:0.61.0" \
            PYTHONPATH=apps/api python scripts/security_scan.py --check all --strict
      - name: Compose validation
        run: docker compose -f infra/docker-compose.yml config --quiet
