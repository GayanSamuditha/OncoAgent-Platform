name: Security readiness

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -e 'apps/api[dev]'
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Tests and static checks
        run: |
          cd apps/api
          python -m pytest
          python -m ruff check app tests
          python -m mypy app
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
      - name: Sanitized source security scan
        run: PYTHONPATH=apps/api python scripts/security_scan.py --check secrets
        continue-on-error: true
      - name: Compose validation
        run: docker compose -f infra/docker-compose.yml config --quiet
